<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodify - Admin Login</title>
    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-form { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 300px; 
        }
        .login-form h2 { 
            text-align: center; 
            color: #00b4d8; 
            margin-bottom: 20px; 
        }
        .login-form input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #00b4d8; 
            border-radius: 5px; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        .login-form input::placeholder {
            color: #b3b3b3;
        }
        .login-form button { 
            width: 100%; 
            padding: 10px; 
            background: #00b4d8; 
            color: #000; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .login-form button:hover {
            background: #90e0ef;
        }
    </style>
</head>
<body>
    <form class="login-form">
        <h2>Admin Login</h2>
        <input type="email" name="admin_email" placeholder="Email" required>
        <input type="password" name="admin_password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</body>
</html>
